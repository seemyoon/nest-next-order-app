services:
  app:
    build:
      context: .
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - order-management-db
      - order-management-redis
    restart: on-failure
    command: sh -c 'yarn start:dev'

  order-management-db:
    image: postgres:16.1
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    environment:
      POSTGRES_USER: '${POSTGRES_USER:-postgresuser}'
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD:-postgrespassword}'
      POSTGRES_DB: '${POSTGRES_DB:-order-app}'
    volumes:
      - ./order-management-db:/var/lib/postgresql/order-management
    restart: on-failure

  order-management-redis:
    image: redis:7.2.3
    ports:
      - '${REDIS_PORT:-6379}:6379'
    command: >
      --requirepass '${REDIS_PASSWORD:-redispassword}'
    restart: unless-stopped

  web:
    image: nginx:alpine
    ports:
      - '80:80'
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    restart: on-failure

volumes:
  order-management-db: